[project]
name = "rl-portfolio-optimization"
version = "0.1.1"
description = "Goal-based dynamic asset allocation with deep reinforcement learning"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pyyaml",
    "gymnasium",
    "stable-baselines3",
    "torch",
    "tensorboard",
    "openpyxl",]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a network; excluded from the default run"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]