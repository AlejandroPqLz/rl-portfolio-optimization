# =============================================================================
# VALIDATION CONFIGURATION: THE SOLVER AGAINST A CLOSED FORM
# =============================================================================
# A SEPARATE configuration, not a variant of the experiment (D44). Its purpose
# is to put the backward induction on a problem whose answer is known in closed
# form, so that an error in the recursion surfaces as a disagreement with
# mathematics rather than as a plausible table nobody can check.
#
# The internal stability checks of 4.3.6 cannot do this. An error in the
# recursion reproduces itself at any resolution, so both of them pass on a
# table that is wrong. They bound the discretisation error; this bounds the
# implementation error, and the two are different claims.
#
# FOUR MISMATCHES BETWEEN THE PAPER AND THIS WORK, AND WHAT IS DONE ABOUT EACH
#   1. Objective. Browne maximises the probability of reaching the goal, which
#      is the lower partial moment of order 0. The experiment minimises the one
#      of order 2, and the two have different optima: comparing a policy of
#      order 2 against a table of order 0 would measure the difference between
#      objectives and not the error of the solver. The objective is therefore
#      set to the indicator HERE and nowhere else.
#   2. Universe. The closed form has one risky asset and one riskless. The
#      experiment has four. The universe is masked to two columns below.
#   3. Leverage. The solution of the paper borrows when wealth is far from the
#      goal and little time remains; the simplex of eq:simplex forbids it. The
#      comparison is therefore valid only outside that region, and the boundary
#      has to be computed from the paper's own expression before any comparison
#      is read.
#   4. Time. The paper is in continuous time and the solver steps monthly. The
#      treatment is refinement rather than argument: the same problem is solved
#      at a month, half a month and a quarter, with the generator parameters
#      rescaled, and the error against the closed form must fall as the step
#      does. A single step size proves nothing.
#
# WHAT IS DELIBERATELY ABSENT
#   The closed-form value and policy of Browne (1999) are NOT in this
#   repository and must not be written from memory. They are transcribed from
#   the paper by the author, with the equation numbers recorded, and only then
#   compared against the tables this configuration produces. Everything here
#   builds the tables; nothing here claims they are right.
# =============================================================================

meta:
  schema_version: 1
  written_on: 2026-10-04
  status: >
    Tables only. The closed-form reference is transcribed from the paper by the
    author and is not part of this file or of the code that reads it.
  reference:
    author: "Browne, S."
    year: 1999
    title: "Reaching goals by a deadline: digital options and continuous-time active portfolio management"
    pending_transcription:
      - "closed-form value function"
      - "closed-form optimal amount in the risky asset"
      - "boundary of the region where that amount exceeds wealth (no-leverage region)"

# --- Where the coefficients come from ----------------------------------------
# Section 5 of docs/browne_reference.md. The paper's three coefficients are read
# from the parameters of the generator itself, so the closed form and the solver
# describe the same market by construction rather than by two readings of the
# data that happen to agree.
#
#   sigma = s          monthly volatility of the log return of the risky column
#   r     = r          monthly log return of the zero-volatility column
#   mu    = m + s^2/2  NOT m
#
# The last line is the step that is easy to get wrong and silent when it is. The
# paper's mu is the drift of dS/S (4.1); its own solution
# S_t = S_0 exp{(mu - s^2/2) t + s W_t} (p. 559) gives the log return a mean of
# mu - s^2/2, so recovering mu from m adds half the variance back. For monthly
# equity that is 9.9e-04 against a premium of 6.6e-03: about a seventh of it,
# far too small to look wrong in a figure and far too large to leave out.
parameter_source: config/gbm_params.yml

# --- The universe ------------------------------------------------------------
# Two columns of the four. The remaining two are masked out, so the action grid
# is one-dimensional: the weight in equity, and the rest riskless.
#
# The memoir states the same configuration as four assets of which three are
# riskless and indistinguishable, with the comparison made on their aggregate.
# The two are the same problem. Masking is preferred here because it makes the
# action grid one-dimensional directly, instead of leaving the solver to split
# an aggregate arbitrarily between three identical columns and relying on the
# reader to re-aggregate.
assets:
  risky: us_equity
  riskless: ust2y
  # mu and sigma of the risky column are the annual geometric mean and the
  # annualised volatility of the frozen matrix, the same two figures the Merton
  # comparator uses (D69). The riskless drift r is the annual geometric mean of
  # the riskless column. All three are read from data/returns_matrix.json, so
  # this file names the columns and never the numbers.
  source: data/returns_matrix.json

# --- The problem -------------------------------------------------------------
# Browne's investor has a goal and a deadline and no income: there are no
# contributions, and the initial wealth is a fraction of the goal rather than
# zero, since with zero wealth and no contributions the problem is trivial.
objective: indicator
contribution_usd: 0
cost_bp: 0
initial_wealth_over_goal: 0.5
horizon_months: 120

# --- The discretisation ------------------------------------------------------
# Finer on both axes than the experimental grid, which costs little once the
# action set is one-dimensional: 101 portfolios instead of 1771, and one
# non-degenerate factor instead of four, so 5 quadrature nodes instead of 625.
n_wealth: 801
wealth_max_over_goal: 4.0
action_step: 0.01
n_quad: 5

# --- Refinement --------------------------------------------------------------
# At k steps per month the horizon becomes 120k steps and the log-return
# parameters of one step are the monthly ones divided by k, which is what makes
# the sequence a refinement of one problem rather than several different ones.
#
# THE WEALTH GRID IS REFINED WITH IT, AND MUST BE. The memoir asks for steps of
# a month, half a month and a quarter, and requires the error to fall as the
# step does; it does not say what happens to the wealth grid, and holding it
# fixed makes that requirement unsatisfiable. Measured on this configuration,
# refining time alone moves the value the WRONG way and by growing amounts:
#
#     k = 1, 2, 4, 8, 16 at 801 nodes:  0.868662  0.867709  0.866587
#                                       0.865265  0.861366
#     successive differences:           -9.5e-04  -1.1e-03  -1.3e-03  -3.9e-03
#
# The cause is the objective. Under the indicator the terminal value is a step
# function of wealth, discontinuous at the goal, and linear interpolation
# smears that jump across one grid cell. Halving the time step doubles the
# number of interpolations without touching the size of the smear, so the error
# accumulates faster than the time discretisation improves. The experimental
# configuration does not have this problem, because the squared shortfall is
# continuous.
#
# Doubling the nodes with each halving of the step converges as it should:
#
#     (k, nodes) = (1, 801) (2, 1601) (4, 3201) (8, 6401):
#                  0.868662  0.874526  0.878469  0.881045
#     successive differences:  +5.9e-03  +3.9e-03  +2.6e-03
#
# monotone, shrinking, and consistent with first-order convergence. The fourth
# level costs ten seconds, so the sequence is cheap to extend if the comparison
# against the closed form asks for it.
refinement:
  - {steps_per_month: 1, n_wealth: 801}
  - {steps_per_month: 2, n_wealth: 1601}
  - {steps_per_month: 4, n_wealth: 3201}

# --- The three checks and their tolerances (D44 as reduced by D72) ------------
# WRITTEN BEFORE THE FIRST RUN, which is the whole of D47: a tolerance chosen
# after seeing the error it is meant to bound is not a tolerance, it is a
# description of the error. These figures are the suggestions of section 6 of
# docs/browne_reference.md, adopted unchanged.
#
# THE COMPARISON SET, common to all three checks. At each step the paper's state
# is z = x e^{r (T - t)}, wealth against the goal discounted to the present. The
# comparison runs over the nodes with
#
#     z*(tau) + margin  <=  z  <  1,      tau = s^2 (T - t)
#
# Both bounds are needed and for different reasons. Below z*(tau) the optimal
# control asks for leverage, which the simplex forbids, so the two are solving
# different problems there. At or above one the bond alone reaches the goal and
# both answers are trivially V = 1 and w = 0, which would flatter the agreement
# without testing anything. The margin keeps the comparison off the boundary
# itself: near it the monthly investor may re-enter the borrowing region before
# the horizon, so the agreement is approximate for a reason that is about the
# problem and not about the solver.
checks:
  margin: 0.05

  # 1. Value. max over steps and nodes of |V_DP - V| with V from section 2.
  #    Absolute, in probability units. The paper's investor trades continuously
  #    and without constraint, this one monthly and on the simplex, so an exact
  #    match is not expected at any resolution; what is required is that the gap
  #    falls as the discretisation refines and is below this at the finest pair.
  value_tolerance: 0.02

  # 2. Policy. max |w_DP - w*| with w* from section 3, in action-grid steps so
  #    that the figure tracks action_step instead of being restated beside it.
  #    Two steps is 0.02 at the declared grid.
  policy_grid_steps: 2

  # 3. Independence from the drift. The paper observes that for a single stock
  #    the optimal control does not involve mu at all (p. 557, equation 3.5),
  #    which is the sharpest available test of the solver: a recursion that had
  #    the drift entering the policy by mistake would pass the first two checks
  #    and fail this one. The solve is repeated with m shifted BOTH ways, the
  #    volatility and the rate held, and the policy must stay put while the value
  #    table moves. Exact independence holds in continuous time only, so the
  #    requirement is a fraction of nodes rather than all of them.
  mu_independence:
    delta_in_monthly_sigma: 1.0   # the shift, in units of s
    agreement_grid_steps: 1
    minimum_agreement: 0.95
    refinement: finest             # scored at the finest pair of the sequence

# --- Leverage variant --------------------------------------------------------
# A SECOND validation configuration, run beside the one above and never in place
# of it. The experimental configuration is untouched and so are the three
# verdicts already recorded for the no-leverage run.
#
# WHY IT EXISTS. The no-leverage run can only compare the two problems where
# they happen to coincide, which is the strip between the borrowing boundary and
# the discounted goal. That strip is narrow, it sits against a boundary the
# monthly investor can cross before the horizon, and the comparison inherits
# both limitations: the value error there is dominated by the constraint rather
# than by the solver. Admitting leverage removes the constraint that separates
# the two problems, so the comparison can run over the whole of 0 < z < 1 and
# the disagreement that remains is the solver's own.
#
# WHAT CHANGES. The equity fraction runs over [0, max_equity_weight] instead of
# [0, 1] and the riskless weight is 1 - w, which goes negative: borrowing at r,
# as the paper's bond allows. The rows of that grid still sum to one and are no
# longer all non-negative, so it is off the simplex of eq:simplex. Nothing else
# in the project enumerates such a grid.
#
# BANKRUPTCY. With borrowing admitted, a bad enough month can in principle take
# wealth through zero, which the squared-shortfall arithmetic of the experiment
# can never do. Wealth is therefore held at zero, which is absorbing because the
# transition multiplies it: a state at zero stays there and collects the
# terminal reward of zero. The floor is applied in the caller, for this
# configuration only, so that the shared transition keeps saying what is true of
# every other configuration.
#
# max_equity_weight = 3 is set by the quadrature and not by taste: at nine nodes
# the worst monthly return the solver sees is about -16 %, so three times
# levered leaves wealth at roughly half and the floor never binds. Whether it
# binds is recorded rather than assumed.
leverage:
  enabled: true
  max_equity_weight: 3.0
  grid_step: 0.02

  # The comparison set is every node with 0 < z < 1: no margin and no boundary,
  # since the boundary was only ever a statement about which problem the solver
  # was allowed to solve. The borrowing region of section 4, z < z*(tau), is
  # reported as its own stratum instead, because that is where the paper's
  # control asks for the leverage this variant grants.
  #
  # TOLERANCES, WRITTEN BEFORE THE FIRST RUN OF THIS VARIANT (D47).
  checks:
    value_tolerance: 0.03          # max |V_DP - V_ref| at the finest pair
    policy_grid_steps: 3           # 3 * 0.02 = 0.06 on the equity weight
    require_monotone_decrease: true

    # Reported beside the policy maximum, because a maximum says how far apart
    # the two policies get and nothing about whether the gap is a bias or a
    # scatter, nor what it costs. The signed mean answers the first and the
    # value loss the second: a policy far from w* that gives up nothing is the
    # objective being flat in the action, not the solver being wrong.
    report_signed_mean: true
    report_value_loss: true

    # Delta is a quarter of the risk premium rather than a multiple of the
    # volatility, so that both directions stay inside the paper's mu >= r. The
    # no-leverage run uses one monthly standard deviation, which is 6.7 times
    # the premium and sends the downward perturbation outside it; that run and
    # its figure are left exactly as recorded.
    #
    # No agreement threshold is declared for this variant. The quantities below
    # are reported as evidence and the verdict rests on the assumption check,
    # because inventing a threshold here after the first one failed is what D47
    # exists to prevent.
    mu_independence:
      delta_as_fraction_of_premium: 0.25
      agreement_grid_steps: 2
      require_paper_assumption_both_ways: true

# --- Theorem 7.1, exogenous income -------------------------------------------
# Section 7, and P1 rather than part of the validation: D72 reduced D44 to the
# three checks above and moved the income case out. The closed forms are
# implemented and unit tested; the runner reaches them only when this is true
# AND --theorem-71 is passed, so neither alone is enough to put an unrequested
# figure into the results.
#
# The mapping is declared here because it is approximate and must be read as
# such: the paper's income is a continuous flow at rate l and the solver's
# contribution is a lump sum at the end of each month, so agreement is bounded
# by that discretisation before anything else.
theorem_7_1:
  enabled: false
  income_per_month: 400
